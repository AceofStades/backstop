[project]
name = "razor-pay"
version = "0.1.0"
description = "Bounded, audited revenue-recovery agent on Razorpay test-mode APIs"
readme = "README.md"
authors = [
    { name = "AceofStades", email = "rahulpbokade@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "razorpay>=1.4",
    "anthropic>=0.40",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
razor-pay = "razor_pay.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
